aggregators:
  # The job boards. A board search sweeps every employer at once - Flipkart,
  # Walmart, Uber, PhonePe, Swiggy, Atlassian, Microsoft, every GCC and
  # product startup - so these are the widest net in the file.
  #
  # A search is a relevance-ranked sample, not a listing, so one term per
  # phrasing is what widens it. Postings also arriving from an employer's own
  # board are merged, not tracked twice (monitor/state.py, soft_key).
  #
  # Each board is its own entry so one being throttled does not cost the
  # others, and the source-health alert names which one went dark.
  # If LinkedIn starts returning nothing, it is rate limiting the runner's IP:
  # set the JOBSPY_PROXIES secret (comma-separated proxy URLs).
  - name: LinkedIn (JobSpy)
    fetcher: jobspy
    sites: [linkedin]
    location: India
    country: India
    results_wanted: 100      # per term; LinkedIn rate limits around page 10
    hours_old: 48            # the sweep runs 12x/day - 2 days is ample overlap
    fetch_description: false # true costs +1 request per job (see the module)
    proxies_env: JOBSPY_PROXIES
    searches: &board_terms
      - senior business analyst
      - business analyst
      - technical business analyst
      - senior data analyst
      - data analyst
      - business intelligence analyst
      - product manager
      - senior product manager
      - product analyst
      - product owner
  - name: Naukri (JobSpy)
    fetcher: jobspy
    sites: [naukri]
    location: India
    country: India
    results_wanted: 60
    hours_old: 48
    proxies_env: JOBSPY_PROXIES
    searches: *board_terms
  - name: Indeed India (JobSpy)
    fetcher: jobspy
    sites: [indeed]
    location: India
    country: India
    results_wanted: 60
    hours_old: 48
    proxies_env: JOBSPY_PROXIES
    searches: *board_terms
